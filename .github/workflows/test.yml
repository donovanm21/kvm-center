name: test

# GitHub Actions source gates plus approved disposable Mongo/browser validation.
# The two are intentionally NOT byte-identical: GitHub-hosted runners
# ship the `gh` CLI (cleaner than the Gitea-side curl/python dance),
# and the `permissions:` block is a GitHub-ism. Keep the gate posture
# and version stamps aligned.
#
# Security-gate posture (v5.20.13):
#   - Go version from go.mod, govulncheck blocking on any reachable stdlib / dep vuln.
#   - npm audit blocking on CRITICAL webui deps, warn on high+ below.
#   - gitleaks blocking on any match in working tree or history;
#     historical placeholders allowlisted via .gitleaksignore.
#   - open-issue-on-failure files / comments on a single
#     security:ci-blocker-labelled issue when any of the above fail
#     on a push to main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go v7 runs the exact go.mod toolchain (GOTOOLCHAIN=local).
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum' # Preserve the pre-v6 cache key input.

      - name: go mod tidy
        run: go mod tidy

      - name: gofmt
        run: |
          changed=$(gofmt -l .)
          if [ -n "$changed" ]; then
            echo "files need gofmt:"; echo "$changed"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Synthetic native-adapter race checks
        run: go test -race ./internal/nativevalidation ./internal/nativework

      - name: Compile opt-in native acceptance without executing
        run: go test -c -tags=nativevalidation -o "$RUNNER_TEMP/native-validation.test" ./server

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...

  webui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false # Preserve the existing uncached npm install.

      - name: npm ci
        working-directory: webui-react
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: form compatibility regressions
        working-directory: webui-react
        run: npm run test:forms

      # v5.32.11 gate: fail the build early on TypeScript or Vite
      # errors. v5.30.0 and v5.31.6 each shipped with tsc errors that
      # only surfaced at docker-build time on the deploy host.
      - name: webui build (tsc + vite)
        working-directory: webui-react
        run: npm run build

      - name: npm audit (CRITICAL — blocking)
        working-directory: webui-react
        run: npm audit --audit-level=critical --omit=dev

      - name: npm audit (high / moderate — warn only)
        working-directory: webui-react
        continue-on-error: true
        run: |
          echo "::group::npm audit summary"
          npm audit --audit-level=high --omit=dev || true
          echo "::endgroup::"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --no-banner --redact --verbose

  mongo-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-mongo-integration
      cancel-in-progress: true
    env:
      KVMC_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:7.0.45-jammy
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'

      - name: Record disposable database version
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker inspect "$MONGO_CONTAINER" --format '{{.Config.Image}} {{.Image}}'
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.version()'

      - name: Validation harness regressions
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate real Mongo persistence
        run: python3 scripts/validate.py --profile mongo --timeout 600

      - name: Verify fixture database cleanup
        if: always()
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval '
            const left = db.adminCommand({listDatabases:1, nameOnly:true}).databases
              .filter(d => d.name.startsWith("kvmc_validation_"));
            if (left.length) { printjson(left.map(d => d.name)); quit(1); }
            print("No validation databases remain");'

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mongo-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/**/report.json
            .validation/**/mongo.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-browser-integration
      cancel-in-progress: true
    env:
      KVMC_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:7.0.45-jammy
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install locked browser tooling
        working-directory: demo/e2e
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npx --no-install playwright install --with-deps chromium webkit
      - name: Record disposable database version
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker inspect "$MONGO_CONTAINER" --format '{{.Config.Image}} {{.Image}}'
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.version()'

      - name: Validate Chromium and iPhone against Mongo
        env:
          KVMC_TEST_BACKEND: mongo
        run: scripts/run-browser-fixture.sh

      - name: Verify fixture database cleanup
        if: always()
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval '
            const left = db.adminCommand({listDatabases:1, nameOnly:true}).databases
              .filter(d => d.name.startsWith("kvmc_validation_"));
            if (left.length) { printjson(left.map(d => d.name)); quit(1); }
            print("No validation databases remain");'

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/**/report.json
            .validation/**/browser.log
            .validation/**/browser-results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  history-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-history
      cancel-in-progress: true
    env:
      KVMC_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:7.0.45-jammy
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Keep synthetic preservation TTL inactive
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval '
            if (!db.adminCommand({setParameter:1, ttlMonitorEnabled:false}).ok) quit(1);
            if (db.adminCommand({getParameter:1, ttlMonitorEnabled:1}).ttlMonitorEnabled !== false) quit(1);'
      - name: Validate capped history and native artifact recovery
        run: python3 scripts/validate-history.py
      - name: Verify fixture database cleanup
        if: always()
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval '
            const left = db.adminCommand({listDatabases:1, nameOnly:true}).databases
              .filter(d => d.name.startsWith("kvmc_validation_"));
            if (left.length) { printjson(left.map(d => d.name)); quit(1); }
            print("No validation databases remain");'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: history-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/history/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  distributable-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-distributable
      cancel-in-progress: true
    env:
      KVMC_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    services:
      mongo:
        image: mongo:7.0.45-jammy
        ports:
          - '127.0.0.1:27017:27017'
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok || quit(1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Validate production image and representative legacy Mongo shape
        run: python3 scripts/validate-distributable.py
      - name: Verify fixture database cleanup
        if: always()
        env:
          MONGO_CONTAINER: ${{ job.services.mongo.id }}
        run: |
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval '
            const left = db.adminCommand({listDatabases:1, nameOnly:true}).databases
              .filter(d => d.name.startsWith("kvmc_validation_"));
            if (left.length) { printjson(left.map(d => d.name)); quit(1); }
            print("No validation databases remain");'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: distributable-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .validation/distributable/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  summary:
    needs: [lint-test, webui-audit, gitleaks, mongo-integration, browser-integration, history-acceptance, distributable-acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: report
        run: |
          echo "lint-test:   ${{ needs.lint-test.result }}"
          echo "webui-audit: ${{ needs.webui-audit.result }}"
          echo "gitleaks:    ${{ needs.gitleaks.result }}"
          echo "mongo:       ${{ needs.mongo-integration.result }}"
          echo "browser:     ${{ needs.browser-integration.result }}"
          echo "history:     ${{ needs.history-acceptance.result }}"
          echo "distributable: ${{ needs.distributable-acceptance.result }}"
          if [ "${{ needs.lint-test.result }}"   = "success" ] \
          && [ "${{ needs.webui-audit.result }}" = "success" ] \
          && [ "${{ needs.gitleaks.result }}"    = "success" ] \
          && [ "${{ needs.mongo-integration.result }}" = "success" ] \
          && [ "${{ needs.browser-integration.result }}" = "success" ] \
          && [ "${{ needs.history-acceptance.result }}" = "success" ] \
          && [ "${{ needs.distributable-acceptance.result }}" = "success" ]; then
            echo "All source and integration gates passed."
          else
            echo "::error::One or more source or integration gates failed — see individual job logs."
            exit 1
          fi

  # Auto-open a GitHub issue when a security gate trips on main, so a
  # CVE landing overnight leaves a durable trail. Uses the `gh` CLI
  # which comes pre-installed on GitHub-hosted runners and picks up
  # GITHUB_TOKEN automatically.
  open-issue-on-failure:
    needs: [lint-test, webui-audit, gitleaks]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: file CI failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          LINT: ${{ needs.lint-test.result }}
          WEB:  ${{ needs.webui-audit.result }}
          LEAK: ${{ needs.gitleaks.result }}
        run: |
          set -eu
          LABEL="security:ci-blocker"
          # Make sure the label exists (idempotent — swallow "already exists").
          gh label create "$LABEL" --color "B60205" --description "CI security gate failure" 2>/dev/null || true

          BODY=$(cat <<MARKDOWN
          **Automated report** — a security gate failed on \`main\`.

          - commit: \`$SHA\`
          - run: $RUN_URL
          - lint-test: \`$LINT\`
          - webui-audit: \`$WEB\`
          - gitleaks: \`$LEAK\`

          See the linked run for the specific finding.
          MARKDOWN
          )

          # Best-effort dedup by label — comment on the existing open
          # issue instead of opening a duplicate.
          existing=$(gh issue list --state open --label "$LABEL" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body "$BODY"
          else
            echo "Opening new issue"
            gh issue create \
              --title "[CI] security gate failing on main" \
              --label "$LABEL" \
              --body "$BODY"
          fi
