version: 2
updates:
  # Go modules at the repo root.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # React webui dependencies.
  - package-ecosystem: npm
    directory: "/webui-react"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime-and-types:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
