# Full stack: server + Mongo
# Usage: docker compose up -d

services:
  # MongoDB — v5.1 primary persistence tier. SCRAM auth from first boot;
  # credentials come from .env (generated by bootstrap.sh if absent).
  # Not exposed on the host network — reachable only via the compose
  # bridge, so kvm-center-server is the sole consumer.
  kvm-center-mongo:
    image: mongo:7
    container_name: kvm-center-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${KVM_MONGO_USER:-kvmcenter}
      - MONGO_INITDB_ROOT_PASSWORD=${KVM_MONGO_PASSWORD:?run bootstrap.sh --deploy once to generate a password into .env}
    volumes:
      - kvm-center-mongo-data:/data/db
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Health check so kvm-center-server's depends_on waits until the
    # mongod process is actually accepting connections — avoids a noisy
    # "connection refused" burst on every cold start.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kvm-center-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:-dev}
    image: kvm-center-server:latest
    container_name: kvm-center-server
    restart: unless-stopped
    ports:
      # v5.32.5: plain-HTTP :8090 fully retired after the guest fleet
      # rotated onto v5.32.4 (all kvm-tools instances now dial
      # https://<host>:8190). Server refuses to start the listener
      # because of KVM_CENTER_DISABLE_HTTP=1 below.
      - "${KVM_CENTER_HTTPS_PORT:-8190}:8190"  # HTTPS — primary UI + agent telemetry.
    environment:
      - KVM_CENTER_ADDR=:8090
      - KVM_CENTER_TLS_ADDR=:8190
      - KVM_CENTER_DISABLE_HTTP=1
      - KVM_CENTER_TLS_DIR=/var/lib/kvm-center/tls
      - KVM_CENTER_CA_DIR=/var/lib/kvm-center/ca
      # Optional cluster DNS domain — hypervisor certs get a SAN at
      # <host_id>.<KVM_CENTER_CLUSTER_DOMAIN> so peers can connect by
      # FQDN without hostname-check failures.
      - KVM_CENTER_CLUSTER_DOMAIN=${KVM_CENTER_CLUSTER_DOMAIN:-cluster.local}
      # Public URL seeds Features.PublicURL on first boot. Once an admin
      # saves a value in Settings → General, the env is ignored.
      - KVM_CENTER_PUBLIC_URL=${KVM_CENTER_PUBLIC_URL:-}
      - KVM_CENTER_DATA=/var/lib/kvm-center/data.json
      # v5.1+: point the server at the compose-local Mongo. First boot
      # migrates the legacy JSON store into the Mongo database and
      # renames it data.json.migrated; subsequent boots skip that.
      - KVM_CENTER_MONGO_URL=mongodb://${KVM_MONGO_USER:-kvmcenter}:${KVM_MONGO_PASSWORD:?set KVM_MONGO_PASSWORD in .env}@kvm-center-mongo:27017/kvm-center?authSource=admin
      - KVM_CENTER_MONGO_DB=kvm-center
    volumes:
      - kvm-center-data:/var/lib/kvm-center
      # Dedicated volume for the cert/key so TLS material survives image
      # rebuilds and is easy to back up separately from the JSON store.
      - kvm-center-tls:/var/lib/kvm-center/tls
    # Healthcheck hits the internal plaintext port (no TLS tooling
    # needed inside the Alpine runtime container). Compose uses this
    # to detect readiness; Docker restarts the container on sustained
    # failure because restart:unless-stopped is set above.
    healthcheck:
      # TLS port is the only listener after v5.32.1. `--no-check-certificate`
      # tolerates the auto-generated self-signed cert — we just want to
      # know the process is accepting connections, not validate chain.
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8190/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      kvm-center-mongo:
        condition: service_healthy
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kvm-net:
    driver: bridge

volumes:
  kvm-center-data:
    driver: local
  kvm-center-tls:
    driver: local
  kvm-center-mongo-data:
    driver: local
