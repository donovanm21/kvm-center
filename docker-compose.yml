# Full stack: server + nginx web UI
# Usage: docker compose up -d
version: "3.8"

services:
  # MongoDB — v5.1 primary persistence tier. SCRAM auth from first boot;
  # credentials come from .env (generated by bootstrap.sh if absent).
  # Not exposed on the host network — reachable only via the compose
  # bridge, so kvm-center-server is the sole consumer.
  kvm-center-mongo:
    image: mongo:7
    container_name: kvm-center-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${KVM_MONGO_USER:-kvmcenter}
      - MONGO_INITDB_ROOT_PASSWORD=${KVM_MONGO_PASSWORD:?run bootstrap.sh --deploy once to generate a password into .env}
    volumes:
      - kvm-center-mongo-data:/data/db
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Health check so kvm-center-server's depends_on waits until the
    # mongod process is actually accepting connections — avoids a noisy
    # "connection refused" burst on every cold start.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kvm-center-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:-dev}
    image: kvm-center-server:latest
    container_name: kvm-center-server
    restart: unless-stopped
    ports:
      - "8090:8090"   # Plain HTTP — agents post here; browser paths 308 to HTTPS.
      - "8190:8190"   # HTTPS (primary endpoint for UI + agent telemetry).
      # 8443 is already taken on the docker host (UniFi controller), so we
      # expose 8190 externally. Agents that trusted :8443 before should
      # switch to :8190; kvm-tools install docs now ship the new URL.
    environment:
      - KVM_CENTER_ADDR=:8090
      - KVM_CENTER_TLS_ADDR=:8190
      - KVM_CENTER_TLS_DIR=/var/lib/kvm-center/tls
      - KVM_CENTER_CA_DIR=/var/lib/kvm-center/ca
      # Optional cluster DNS domain — hypervisor certs get a SAN at
      # <host_id>.<KVM_CENTER_CLUSTER_DOMAIN> so peers can connect by
      # FQDN without hostname-check failures.
      - KVM_CENTER_CLUSTER_DOMAIN=${KVM_CENTER_CLUSTER_DOMAIN:-don.homelab}
      - KVM_CENTER_DATA=/var/lib/kvm-center/data.json
      # v5.1+: point the server at the compose-local Mongo. First boot
      # migrates the legacy JSON store into the Mongo database and
      # renames it data.json.migrated; subsequent boots skip that.
      - KVM_CENTER_MONGO_URL=mongodb://${KVM_MONGO_USER:-kvmcenter}:${KVM_MONGO_PASSWORD:?set KVM_MONGO_PASSWORD in .env}@kvm-center-mongo:27017/kvm-center?authSource=admin
      - KVM_CENTER_MONGO_DB=kvm-center
    volumes:
      - kvm-center-data:/var/lib/kvm-center
      # Dedicated volume for the cert/key so TLS material survives image
      # rebuilds and is easy to back up separately from the JSON store.
      - kvm-center-tls:/var/lib/kvm-center/tls
    depends_on:
      kvm-center-mongo:
        condition: service_healthy
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kvm-center-webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: kvm-center-webui:latest
    container_name: kvm-center-webui
    restart: unless-stopped
    ports:
      - "8096:80"     # Browse to http://<host>:8096 (8095 used by host-monitor-ui)
    environment:
      - KVM_CENTER_SERVER_HOST=kvm-center-server   # Service name on internal network.
      - KVM_CENTER_SERVER_PORT=8090
    depends_on:
      - kvm-center-server
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Permanent download portal that serves the cross-compiled agent and
  # kvm-tools binaries plus install scripts. Referenced by the Deployment
  # page in the web UI.
  kvm-center-build:
    build:
      context: .
      dockerfile: Dockerfile.build
    image: kvm-center-build:latest
    container_name: kvm-center-build
    restart: unless-stopped
    ports:
      - "8097:8080"   # Download portal — referenced by the Deployment UI page.
    networks:
      - kvm-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  kvm-net:
    driver: bridge

volumes:
  kvm-center-data:
    driver: local
  kvm-center-tls:
    driver: local
  kvm-center-mongo-data:
    driver: local
