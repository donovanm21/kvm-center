<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVM-Center | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-running { color: #10b981; }
        .status-shutoff { color: #ef4444; }
        .status-paused { color: #f59e0b; }
        .card-hover:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- Nav -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🌸</span>
                <h1 class="text-xl font-bold tracking-tight">KVM-Center</h1>
            </div>
            <div class="flex items-center gap-4">
                <div id="connection-status" class="text-xs px-2 py-1 rounded-full bg-slate-800 text-slate-400">
                    Checking Server...
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Host Grid -->
        <section class="mb-12">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-4">Hypervisors</h2>
            <div id="host-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Hosts will be injected here -->
                <div class="animate-pulse bg-slate-800 h-24 rounded-xl"></div>
                <div class="animate-pulse bg-slate-800 h-24 rounded-xl"></div>
                <div class="animate-pulse bg-slate-800 h-24 rounded-xl"></div>
            </div>
        </section>

        <!-- VM Table -->
        <section>
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Virtual Machines</h2>
                <div class="flex gap-2">
                    <input id="vm-search" type="text" placeholder="Search VMs..." class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-700/50 text-slate-400 font-medium">
                        <tr>
                            <th class="px-4 py-3">VM Name</th>
                            <th class="px-4 py-3">Host</th>
                            <th class="px-4 py-3">Status</th>
                            <th class="px-4 py-3 text-right">Resources</th>
                            <th class="px-4 py-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="vm-table-body" class="divide-y divide-slate-700">
                        <!-- VMs will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const API_BASE = "http://REDACTED-HOST:8085/api";

        async function updateDashboard() {
            try {
                const [hostsRes, vmsRes] = await Promise.all([
                    fetch(`${API_BASE}/hosts`),
                    fetch(`${API_BASE}/vms`)
                ]);
                
                const hosts = await hostsRes.json();
                const vms = await vmsRes.json();

                document.getElementById('connection-status').textContent = 'Online';
                document.getElementById('connection-status').className = 'text-xs px-2 py-1 rounded-full bg-green-900/30 text-green-400';

                renderHosts(hosts);
                renderVMs(vms);
            } catch (e) {
                document.getElementById('connection-status').textContent = 'Offline';
                document.getElementById('connection-status').className = 'text-xs px-2 py-1 rounded-full bg-red-900/30 text-red-400';
                console.error("Dashboard update failed:", e);
            }
        }

        function renderHosts(hosts) {
            const grid = document.getElementById('host-grid');
            grid.innerHTML = hosts.map(h => `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 card-hover">
                    <div class="flex justify-between items-start mb-3">
                        <span class="font-bold">${h.host_id}</span>
                        <span class="text-xs text-slate-500">${h.last_seen}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-500">CPU</span>
                            <span class="font-mono">${h.cpu_usage.toFixed(1)}%</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-500">MEM</span>
                            <span class="font-mono">${h.mem_usage.toFixed(1)}%</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderVMs(vms) {
            const body = document.getElementById('vm-table-body');
            const search = document.getElementById('vm-search').value.toLowerCase();
            
            const filtered = vms.filter(vm => vm.name.toLowerCase().includes(search));

            body.innerHTML = filtered.map(vm => `
                <tr class="hover:bg-slate-700/30 transition-colors">
                    <td class="px-4 py-3 font-medium">${vm.name}</td>
                    <td class="px-4 py-3 text-slate-400">${vm.host_id}</td>
                    <td class="px-4 py-3">
                        <span class="status-${vm.state.toLowerCase()} text-xs font-bold">${vm.state}</span>
                    </td>
                    <td class="px-4 py-3 text-right font-mono text-xs text-slate-400">
                        ${vm.cpu} vCPU | ${Math.round(vm.mem / 1024)}MB
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="alert('Action coming soon!')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs transition-colors">Manage</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('vm-search').addEventListener('input', () => {
            // We don't need to re-fetch, just re-render with the cached data
            // In a real app we'd store the VMs in a variable
            updateDashboard(); 
        });

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
