name: test

# Gitea Actions workflow. Runs on every push; matches the `make check`
# target operators run locally. Keeps the runner lean — no Docker,
# no network access beyond the module proxy + osv.dev / npm registry
# for the vuln scanners.
#
# Security-gate posture (v5.20.13):
#   - Go 1.25, govulncheck blocking on any reachable stdlib / dep vuln.
#   - npm audit blocking on CRITICAL webui deps, warn on high+ below.
#   - gitleaks blocking on any match in working tree or history;
#     historical placeholders allowlisted via .gitleaksignore.
#   - open-issue-on-failure files / comments on a single
#     security:ci-blocker-labelled issue when any of the above fail
#     on a push to main.
# Gitea surfaces workflow failures in the repo Actions tab + emails
# watchers; the summary step below prints a concise line so the alert
# carries enough context to triage.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          # v5.46.1: disable the GHA cache layer. setup-go@v5 defaults
          # to `cache: true`, which probes a Gitea cache server that
          # isn't reachable from this runner's job-container network
          # — every run wasted ~270 s on the restore timeout and
          # another ~270 s on the save timeout. ~9 min reclaimed per
          # test run.
          cache: false

      # go.sum is generated on-demand in Dockerfile.build via `go mod
      # tidy` and isn't committed, so the CI job has to materialise
      # it before vet/test can resolve modules.
      - name: go mod tidy
        run: go mod tidy

      # Fast gates first — gofmt + vet catch 90% of trivially bad
      # commits in seconds.
      - name: gofmt
        run: |
          changed=$(gofmt -l .)
          if [ -n "$changed" ]; then
            echo "files need gofmt:"; echo "$changed"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # v5.49 (PR-1a): tiny shell-script unit-test runner for the
      # publish-gate logic. Cheap (sub-second) and catches regressions
      # in the version-comparison + [publish] handling. Add other shell
      # tests here as the scripts/ tree grows.
      - name: shell tests
        run: |
          set -e
          for t in scripts/*_test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

      # govulncheck reports ONLY reachable vulnerabilities (symbols the
      # code actually imports + calls), so a non-zero exit is always
      # worth failing on. Upgrade / patch / suppress with an inline
      # `//go:build !govulncheck_ignore` + comment when triaging.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...

  webui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci
        working-directory: webui-react
        run: npm ci --no-audit --no-fund --loglevel=error

      # v5.32.11 gate: fail the build early on TypeScript or Vite
      # errors. v5.30.0 and v5.31.6 each shipped with tsc errors that
      # only surfaced at docker-build time on the deploy host, which
      # meant broken release tags could merge to main first. `npm run
      # build` invokes `tsc -b --noEmit && vite build`, the same
      # pipeline the Dockerfile.webui stage runs.
      - name: webui build (tsc + vite)
        working-directory: webui-react
        run: npm run build

      # Blocking gate — only CRITICAL vulns fail the build. Upgrading
      # to match a high-severity finding still happens (see the warn
      # step below) but it won't block a Monday-morning merge.
      - name: npm audit (CRITICAL — blocking)
        working-directory: webui-react
        run: npm audit --audit-level=critical --omit=dev

      # Warn-only gate. `|| true` keeps the step green; the summary
      # appears in the Actions log and any emails Gitea sends about
      # this run, so "high severity dropped overnight" still lands in
      # a human's inbox without breaking CI.
      - name: npm audit (high / moderate — warn only)
        working-directory: webui-react
        continue-on-error: true
        run: |
          echo "::group::npm audit summary"
          npm audit --audit-level=high --omit=dev || true
          echo "::endgroup::"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan can see past blobs

      # Scan the working tree + full commit history for accidentally
      # committed secrets. Blocking — the project rule is that secrets
      # never land in the repo, so any match is an incident.
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --no-banner --redact --verbose

  summary:
    # Always runs last so the aggregated result (and the failure line
    # in any email Gitea sends) names the gate that actually tripped.
    needs: [lint-test, webui-audit, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: report
        run: |
          echo "lint-test:   ${{ needs.lint-test.result }}"
          echo "webui-audit: ${{ needs.webui-audit.result }}"
          echo "gitleaks:    ${{ needs.gitleaks.result }}"
          if [ "${{ needs.lint-test.result }}"   = "success" ] \
          && [ "${{ needs.webui-audit.result }}" = "success" ] \
          && [ "${{ needs.gitleaks.result }}"    = "success" ]; then
            echo "All security gates passed."
          else
            echo "::error::One or more security gates failed — see individual job logs."
            exit 1
          fi

  # Auto-open a Gitea issue when a security gate trips on main, so a
  # CVE landing overnight leaves a durable trail (emails get lost in
  # the noise). Runs only on main-branch pushes — PR failures are
  # already surfaced inline on the PR itself. Dedup is best-effort:
  # we skip when an open issue already has our fingerprint label.
  open-issue-on-failure:
    needs: [lint-test, webui-audit, gitleaks]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: file CI failure issue
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          LINT: ${{ needs.lint-test.result }}
          WEB:  ${{ needs.webui-audit.result }}
          LEAK: ${{ needs.gitleaks.result }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then
            echo "No token — skipping auto-issue."; exit 0
          fi
          # Delegate the whole thing to python so we don't have to
          # juggle shell heredocs + env var exports + json quoting.
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          api  = os.environ["REPO_API"]
          tok  = os.environ["TOKEN"]
          hdrs = {"Authorization": f"token {tok}", "Content-Type": "application/json"}
          label = "security:ci-blocker"
          body = (
              "**Automated report** — a security gate failed on `main`.\n\n"
              f"- commit: `{os.environ['SHA']}`\n"
              f"- run: {os.environ['RUN_URL']}\n"
              f"- lint-test: `{os.environ['LINT']}`\n"
              f"- webui-audit: `{os.environ['WEB']}`\n"
              f"- gitleaks: `{os.environ['LEAK']}`\n\n"
              "See the linked run for the specific finding. Triage playbook in "
              "[docs/DEVELOPMENT.md](../blob/main/docs/DEVELOPMENT.md#ci-security-gates-v5205)."
          )
          def do(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=hdrs, method=method)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or b"null")
          # Dedup by label — comment on existing open issue.
          q = urllib.parse.urlencode({"state": "open", "type": "issues", "labels": label})
          try:
              found = do("GET", f"{api}/issues?{q}")
          except urllib.error.HTTPError:
              found = []
          if found:
              num = found[0]["number"]
              print(f"Updating existing issue #{num}")
              do("POST", f"{api}/issues/{num}/comments", {"body": body})
          else:
              print("Opening new issue")
              issue = do("POST", f"{api}/issues", {
                  "title": "[CI] security gate failing on main",
                  "body": body,
              })
              # Label may not exist yet on a fresh repo; tolerate 422.
              try:
                  do("POST", f"{api}/issues/{issue['number']}/labels", {"labels": [label]})
              except urllib.error.HTTPError as e:
                  print(f"(label attach skipped: {e})")
          PY
