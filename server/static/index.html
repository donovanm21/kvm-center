    const v = typeof o === 'string' ? o : o.value;
    const l = typeof o === 'string' ? o : o.label;
    return `<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`;
  }).join('')}</select>`;
  const inp = (id, type, val, ph, extra) => `<input type="${type||'text'}" id="${id}" value="${esc(val||'')}" placeholder="${esc(ph||'')}" ${extra||''}>`;

  const createForm = `
    ${formField('VM Name', 'cvm-name', inp('cvm-name','text','','e.g. my-new-vm'))}
    ${formField('Operating System', 'cvm-os', sel('cvm-os', [{label:'(select)',value:''}, ...popularOS], ''))}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${formField('Memory (MB)', 'cvm-mem', inp('cvm-mem','number','2048','','min=256 step=256'))}
      ${formField('vCPUs', 'cvm-vcpus', inp('cvm-vcpus','number','2','','min=1 max=128'))}
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
      ${formField('Disk Size (GB)', 'cvm-disk', inp('cvm-disk','number','20','','min=1'))}
      ${formField('Disk Format', 'cvm-diskfmt', sel('cvm-diskfmt', ['qcow2','raw'], 'qcow2'))}
    </div>
    ${formField('Install Media (ISO)', 'cvm-iso', sel('cvm-iso', [{label:'(none — PXE boot)',value:''}, ...isos.map(i => ({label:i.split('/').pop(),value:i}))], ''))}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${formField('Network Bridge', 'cvm-bridge', sel('cvm-bridge', bridges.length ? bridges : ['br0'], bridges[0]||'br0'))}
      ${formField('Firmware', 'cvm-firmware', sel('cvm-firmware', [{label:'BIOS (SeaBIOS)',value:'bios'},{label:'UEFI (OVMF)',value:'efi'}], 'bios'))}
    </div>
    ${formField('Storage Pool', 'cvm-pool', sel('cvm-pool', pools.map(p=>({label:p.name+' ('+p.path+')',value:p.path})), pools[0]?.path||'/var/lib/libvirt/images'))}
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:12px">
      <input type="checkbox" id="cvm-autostart" style="accent-color:#E3571E">
      <span style="font-size:12px;color:var(--text-body)">Start on host boot (autostart)</span>
    </label>
  `;

  const importForm = `
    ${formField('VM Name', 'cvm-name', inp('cvm-name','text','','e.g. imported-vm'))}
    ${formField('Operating System', 'cvm-os', sel('cvm-os', [{label:'(select)',value:''}, ...popularOS], ''))}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${formField('Memory (MB)', 'cvm-mem', inp('cvm-mem','number','2048','','min=256 step=256'))}
      ${formField('vCPUs', 'cvm-vcpus', inp('cvm-vcpus','number','2','','min=1 max=128'))}
    </div>
    ${formField('Existing Disk Image Path', 'cvm-import', inp('cvm-import','text','','/var/lib/libvirt/images/existing.qcow2'))}
    <div style="font-size:10px;color:var(--text-faded);margin:-8px 0 12px 0">Full path to an existing qcow2, raw, or vmdk disk image on this hypervisor</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${formField('Network Bridge', 'cvm-bridge', sel('cvm-bridge', bridges.length ? bridges : ['br0'], bridges[0]||'br0'))}
      ${formField('Firmware', 'cvm-firmware', sel('cvm-firmware', [{label:'BIOS (SeaBIOS)',value:'bios'},{label:'UEFI (OVMF)',value:'efi'}], 'bios'))}
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:12px">
      <input type="checkbox" id="cvm-autostart" style="accent-color:#E3571E">
      <span style="font-size:12px;color:var(--text-body)">Start on host boot (autostart)</span>

  `;

  const html = `
    <div class="modal-overlay" id="create-vm-modal" style="display:flex" onclick="if(event.target===this)closeCreateVM()">
      <div class="modal" style="width:560px;max-width:calc(100vw - 32px);max-height:90vh;overflow-y:auto">
        <h3>Create Virtual Machine</h3>

        ${formField('Hypervisor', 'cvm-host', sel('cvm-host', onlineHosts.map(h => ({label:h.id+' ('+h.ip+')',value:h.id})), cv.host_id) + `<script>document.getElementById('cvm-host').onchange=switchCreateVMHost<\/script>`)}

        <div style="display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #30363D">
          <div class="tab ${mode==='create'?'active':''}" onclick="switchCreateVMMode('create')" style="cursor:pointer;padding:6px 14px;font-size:12px;border-bottom:2px solid ${mode==='create'?'#E3571E':'transparent'};color:${mode==='create'?'#F0F6FC':'#8B949E'}">New VM</div>

async function submitCreateVM() {
  const cv = state.createVM;
  const mode = cv.mode;
  const hostID = document.getElementById('cvm-host')?.value || cv.host_id;

  const name = document.getElementById('cvm-name')?.value?.trim();
  if (!name) { toast('error', 'VM name is required'); return; }

  const body = {
    name,
    memory_mb: parseInt(document.getElementById('cvm-mem')?.value) || 2048,
    vcpus: parseInt(document.getElementById('cvm-vcpus')?.value) || 2,
    os_variant: document.getElementById('cvm-os')?.value || '',
    bridge: document.getElementById('cvm-bridge')?.value || 'br0',
    firmware: document.getElementById('cvm-firmware')?.value || 'bios',
    autostart: document.getElementById('cvm-autostart')?.checked || false,
  };

  if (mode === 'create') {
    body.disk_size_gb = parseInt(document.getElementById('cvm-disk')?.value) || 20;
    body.disk_format = document.getElementById('cvm-diskfmt')?.value || 'qcow2';
    body.iso_path = document.getElementById('cvm-iso')?.value || '';
    body.pool_path = document.getElementById('cvm-pool')?.value || '/var/lib/libvirt/images';
  } else {
    body.import_disk = document.getElementById('cvm-import')?.value?.trim() || '';
    if (!body.import_disk) { toast('error', 'Disk image path is required for import'); return; }
  }

  const btn = document.getElementById('cvm-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  toast('info', `Creating VM "${name}" on ${hostID}…`);

  try {
    const r = await fetch(`${API}/api/vm-create?host=${encodeURIComponent(hostID)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (data.success) {
      closeCreateVM();
      toast('success', data.message || `VM "${name}" created`);
      setTimeout(refresh, 3000);
    } else {
      toast('error', `Failed: ${data.error || 'unknown error'}`);
      if (btn) { btn.disabled = false; btn.textContent = mode === 'create' ? 'Create & Start' : 'Import & Start'; }
    }
  } catch (e) {
    toast('error', `Failed: ${e.message}`);
    if (btn) { btn.disabled = false; btn.textContent = mode === 'create' ? 'Create & Start' : 'Import & Start'; }
  }
}

// ── File Browser ───────────────────────────────────────────
async function openFileBrowser(hostID, path) {
  state.fileBrowser = { host_id: hostID, path, entries: [], loading: true, uploading: false };
  render();
  await fetchBrowse(hostID, path);
}

function closeFileBrowser() {
  state.fileBrowser = null;
  render();
}

async function fetchBrowse(hostID, path) {
  state.fileBrowser.loading = true;
  state.fileBrowser.path = path;
  render();
  try {
    const r = await fetch(`${API}/api/storage/browse?host=${encodeURIComponent(hostID)}&path=${encodeURIComponent(path)}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    state.fileBrowser.entries = data.entries || [];
    state.fileBrowser.path = data.path || path;
  } catch (e) {
    toast('error', `Browse failed: ${e.message}`);
    state.fileBrowser.entries = [];
  } finally {
    state.fileBrowser.loading = false;
    render();
  }
}

function browseNavigate(idx) {
  const fb = state.fileBrowser;
  const entry = fb.entries[idx];
  if (!entry || !entry.is_dir) return;
  fetchBrowse(fb.host_id, fb.path + '/' + entry.name);
}

async function browseUp() {
  const fb = state.fileBrowser;
  const parent = fb.path.replace(/\/[^/]+$/, '') || '/';
  await fetchBrowse(fb.host_id, parent);
}

async function deleteStorageFile(idx) {
  const fb = state.fileBrowser;
  const entry = fb.entries[idx];
  if (!entry) return;
  const fileName = entry.name;
  if (!confirm(`Delete "${fileName}" from ${fb.path}?\n\nThis cannot be undone.`)) return;
  const filePath = fb.path + '/' + fileName;
  try {
    const r = await fetch(`${API}/api/storage/file?host=${encodeURIComponent(fb.host_id)}&path=${encodeURIComponent(filePath)}`, { method: 'DELETE' });
    const data = await r.json();
    if (data.success) {
      toast('success', data.message || `Deleted ${fileName}`);
      await fetchBrowse(fb.host_id, fb.path);
    } else {
      toast('error', `Delete failed: ${data.error || 'unknown'}`);
    }
  } catch (e) {
    toast('error', `Delete failed: ${e.message}`);
  }
}

function triggerUpload() {
  document.getElementById('fb-upload-input').click();
}

async function handleUpload(input) {
  const fb = state.fileBrowser;
  if (!input.files || !input.files.length) return;
  const file = input.files[0];
  fb.uploading = true;
  render();
  toast('info', `Uploading ${file.name} (${(file.size/1048576).toFixed(1)} MB)…`);
  try {
    const form = new FormData();
    form.append('file', file);
    const r = await fetch(`${API}/api/storage/upload?host=${encodeURIComponent(fb.host_id)}&path=${encodeURIComponent(fb.path)}`, {
      method: 'POST',
      body: form,
    });
    const data = await r.json();
    if (data.success) {
      toast('success', `Uploaded ${data.name} (${(data.size/1048576).toFixed(1)} MB)`);
      await fetchBrowse(fb.host_id, fb.path);
    } else {
      toast('error', `Upload failed: ${data.error || 'unknown'}`);
    }
  } catch (e) {
    toast('error', `Upload failed: ${e.message}`);
  } finally {
    fb.uploading = false;
    input.value = '';
    render();
  }
}

function fmtFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(2) + ' GB';
}

function fileIcon(entry) {
  if (entry.is_dir) return '<span style="color:#FF8A3C">&#128193;</span>';
  const ext = entry.name.split('.').pop().toLowerCase();
  if (['iso','img'].includes(ext)) return '<span style="color:#ff9800">&#128191;</span>';
  if (['qcow2','vmdk','vdi','vhd','raw'].includes(ext)) return '<span style="color:#7c4dff">&#128190;</span>';
  if (['xml','conf','cfg'].includes(ext)) return '<span style="color:#4caf50">&#128196;</span>';
  if (['log','txt'].includes(ext)) return '<span style="color:var(--text-muted)">&#128196;</span>';
  return '<span style="color:var(--text-faded)">&#128196;</span>';
}

function renderFileBrowser() {
  const fb = state.fileBrowser;
  if (!fb) return '';

  const host = state.hosts.find(h => h.id === fb.host_id);
  const hostLabel = host ? `${fb.host_id} (${host.ip})` : fb.host_id;

  // Breadcrumb path segments.
  const segments = fb.path.split('/').filter(Boolean);
  let crumbPath = '';
  const crumbs = segments.map((seg, i) => {
    crumbPath += '/' + seg;
    const p = crumbPath;
    const isLast = i === segments.length - 1;
    return isLast
      ? `<span style="color:var(--text-strong)">${esc(seg)}</span>`
      : `<a href="#" onclick="fetchBrowse('${esc(fb.host_id)}','${esc(p)}');return false" style="color:#FF8A3C;text-decoration:none">${esc(seg)}</a>`;
  });

  const fileRows = fb.loading
    ? `<tr><td colspan="4" style="text-align:center;color:var(--text-faded);padding:24px">Loading…</td></tr>`
    : fb.entries.length === 0
      ? `<tr><td colspan="4" style="text-align:center;color:var(--text-disabled);padding:24px">Empty directory</td></tr>`
      : fb.entries.map((e, idx) => `
        <tr${e.is_dir ? ` onclick="browseNavigate(${idx})" style="cursor:pointer"` : ''}>
          <td style="white-space:nowrap">${fileIcon(e)} <span style="color:${e.is_dir ? '#FF8A3C' : '#F0F6FC'};font-weight:${e.is_dir ? '600' : '400'}">${esc(e.name)}</span></td>
          <td style="color:var(--text-muted);font-size:11px;white-space:nowrap">${e.is_dir ? '—' : fmtFileSize(e.size)}</td>
          <td style="color:var(--text-faded);font-size:11px;white-space:nowrap">${e.modified ? new Date(e.modified).toLocaleString([], {dateStyle:'short',timeStyle:'short'}) : '—'}</td>
          <td onclick="event.stopPropagation()">
            ${!e.is_dir ? `<button class="btn btn-danger btn-sm" onclick="deleteStorageFile(${idx})">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');

  return `
    <div class="detail-panel" style="margin-top:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div style="min-width:0">
          <div style="font-size:14px;font-weight:600;color:var(--text-strong);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            File Browser
            <span style="font-size:11px;font-weight:400;color:var(--text-faded)">${esc(hostLabel)}</span>
          </div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:'SF Mono',monospace;display:flex;align-items:center;gap:4px;flex-wrap:wrap">
            <a href="#" onclick="fetchBrowse('${esc(fb.host_id)}','/');return false" style="color:#FF8A3C;text-decoration:none">/</a>
            ${crumbs.map(c => `<span style="color:var(--text-disabled)">/</span> ${c}`).join(' ')}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-secondary btn-sm" onclick="browseUp()">&#8593; Up</button>
          <button class="btn btn-primary btn-sm" onclick="triggerUpload()" ${fb.uploading?'disabled':''}>${fb.uploading ? 'Uploading…' : 'Upload File'}</button>
          <button class="btn btn-secondary btn-sm" onclick="fetchBrowse('${esc(fb.host_id)}','${esc(fb.path)}')">&#8635; Refresh</button>
          <button class="btn btn-secondary btn-sm" onclick="closeFileBrowser()">Close</button>
          <input type="file" id="fb-upload-input" style="display:none" onchange="handleUpload(this)">
        </div>
      </div>
      <div class="table-wrap" style="border:none">
        <table>
          <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th></th></tr></thead>
          <tbody>${fileRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ── Migrations view ────────────────────────────────────────
function renderMigrationsView() {
  const migs = state.migrations || [];
  const active = migs.filter(m => m.status === 'running');
  const past = migs.filter(m => m.status !== 'running');

  const statusPill = (s) => `<span class="mig-status-pill ${esc(s)}">${esc(s)}</span>`;

  const fmtTime = (ts) => {
    if (!ts) return '—';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  };

  const fmtDuration = (sec) => {
    if (!sec) return '—';
    if (sec < 60) return sec + 's';
    return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
  };

  // Active migrations with live progress.
  const activeSection = active.length ? `
    <div class="section-title">Active Migrations (${active.length})</div>
    ${active.map(m => {
      const pct = m.progress || 0;
      return `
        <div class="detail-panel" style="border-left:3px solid #E3571E;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div>
              <div style="font-size:15px;font-weight:600;color:var(--text-strong)">${esc(m.vm_name)}</div>
              <div style="font-size:11px;color:var(--text-faded)">${esc(m.source_host)} → ${esc(m.dest_host)} · ${esc(m.mode)}</div>
            </div>
            ${statusPill(m.status)}
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:12px;color:var(--text-body)">${esc(m.phase || 'starting')}</span>
            <span style="font-size:12px;color:var(--text-strong)">${pct}%</span>
          </div>
          <div class="resource-bar" style="height:8px"><div class="resource-bar-fill bar-cpu" style="width:${pct}%;transition:width 0.5s"></div></div>
          <div style="font-size:11px;color:var(--text-faded);margin-top:6px">${esc(m.detail || '')} · Started ${fmtTime(m.started_at)}</div>
        </div>
      `;
    }).join('')}
  ` : '';

  // Past migrations table.
  const pastSection = past.length ? `
    <div class="section-title">Migration History (${past.length})</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>VM</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Mode</th>
            <th>Status</th>
            <th>Started</th>
            <th>Duration</th>
            <th>Detail</th>
          </tr>
        </thead>
        <tbody>
          ${past.map(m => `
            <tr>
              <td style="font-weight:500;color:var(--text-strong)">${esc(m.vm_name)}</td>
              <td style="color:var(--text-muted);font-size:11px">${esc(m.source_host)}</td>
              <td style="color:var(--text-muted);font-size:11px">${esc(m.dest_host)}</td>
              <td>
                <span class="mig-mode-pill ${m.mode==='offline'?'offline':'live'}">${esc(m.mode)}</span>
              </td>
              <td>${statusPill(m.status)}</td>
              <td style="font-size:11px;color:var(--text-muted);white-space:nowrap">${fmtTime(m.started_at)}</td>
              <td style="font-size:11px;color:var(--text-body)">${fmtDuration(m.elapsed_sec)}</td>
              <td style="font-size:11px;color:var(--text-faded);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(m.error || m.detail || '')}">${esc(m.error || m.detail || '—')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  const emptyMsg = (!active.length && !past.length) ? emptyState('No migrations', 'Migration history will appear here when you migrate a VM between hypervisors.') : '';

  return `
    <div class="summary-grid" style="margin-bottom:20px">
      <div class="summary-card accent">
        <div class="label">Total Migrations</div>
        <div class="value">${migs.length}</div>
        <div class="sub">${active.length} active</div>
      </div>
      <div class="summary-card green-accent">
        <div class="label">Successful</div>
        <div class="value">${migs.filter(m=>m.status==='complete').length}</div>
      </div>
      <div class="summary-card red-accent">
        <div class="label">Failed</div>
        <div class="value">${migs.filter(m=>m.status==='failed').length}</div>
      </div>
    </div>
    ${activeSection}
    ${pastSection}
    ${emptyMsg}
  `;
}

// ── Settings view (Users / Groups / Roles) ────────────────
async function loadSettingsData() {
  try {
    const [users, groups, rolesResp, idps] = await Promise.all([
      fetchJSON('/api/users'),
      fetchJSON('/api/groups'),
      fetchJSON('/api/roles'),
      fetchJSON('/api/idps').catch(() => []),
    ]);
    state.users = users || [];
    state.groups = groups || [];
    state.roles = (rolesResp && rolesResp.roles) || [];
    state.permissionsList = (rolesResp && rolesResp.permissions) || [];
    state.idps = idps || [];
    if (state.view === 'settings') render();
  } catch (e) {
    if (e.message !== 'session expired') toast('error', 'Failed to load settings: ' + e.message);
  }
}

function setSettingsTab(t) {
  state.settingsTab = t;
  state.userForm = null; state.groupForm = null; state.roleForm = null; state.idpForm = null;
  persistRoute();
  render();
}

function renderSettingsView() {
  const tab = state.settingsTab || 'users';
  const tabs = [
    ['users', 'Users'],
    ['groups', 'Groups'],
    ['roles', 'Roles'],
    ['providers', 'Identity Providers'],
  ];
  const tabHtml = tabs.map(([t, label]) => `
    <div class="settings-tab ${tab===t?'active':''}" onclick="setSettingsTab('${t}')">${label}</div>
  `).join('');

  let body = '';
  if (tab === 'users') body = renderSettingsUsers();
  else if (tab === 'groups') body = renderSettingsGroups();
  else if (tab === 'roles') body = renderSettingsRoles();
  else if (tab === 'providers') body = renderSettingsProviders();

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h2 style="margin:0;font-size:18px;font-weight:600;color:var(--text-strong)">Settings</h2>
    </div>
    <div class="settings-tabs">${tabHtml}</div>
    ${body}
  `;
}

// ── Users ──
function renderSettingsUsers() {
  const roleName = (id) => state.roles.find(r => r.id === id)?.name || id;
  const groupName = (id) => state.groups.find(g => g.id === id)?.name || id;

  const rows = state.users.map(u => `
    <tr>
      <td style="font-weight:500;color:var(--text-strong)">${esc(u.username)}</td>
      <td style="color:var(--text-muted)">${esc(u.email || '—')}</td>
      <td>${u.role_ids && u.role_ids.length ? u.role_ids.map(id => `<span style="display:inline-block;padding:2px 8px;background:var(--surface-3);border-radius:10px;font-size:10px;margin-right:4px">${esc(roleName(id))}</span>`).join('') : '<span style="color:var(--text-faded)">none</span>'}</td>
      <td>${u.group_ids && u.group_ids.length ? u.group_ids.map(id => `<span style="display:inline-block;padding:2px 8px;background:var(--surface-3);border-radius:10px;font-size:10px;margin-right:4px">${esc(groupName(id))}</span>`).join('') : '<span style="color:var(--text-faded)">none</span>'}</td>
      <td>${u.enabled ? '<span class="status-pill online">● Active</span>' : '<span class="status-pill offline">● Disabled</span>'}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick='openUserForm("edit", ${JSON.stringify(u)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteUser('${esc(u.id)}', '${esc(u.username)}')">Delete</button>
      </td>
    </tr>

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn btn-primary" onclick="openUserForm('new', null)">+ Add User</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Email</th><th>Roles</th><th>Groups</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-faded)">No users</td></tr>'}</tbody>
      </table>
    </div>
    ${state.userForm ? renderUserFormModal() : ''}
  `;
}

function openUserForm(mode, user) {
  state.userForm = {
    mode,
    data: mode === 'edit' ? JSON.parse(JSON.stringify(user)) : {
      username:'', email:'', password:'', enabled: true, role_ids: [], group_ids: [],
    },
  };
  render();
}
function closeUserForm() { state.userForm = null; render(); }

function renderUserFormModal() {
  const f = state.userForm;
  if (!f) return '';
  const isNew = f.mode === 'new';
  const checkboxList = (items, selected, kind) => items.map(it => `
    <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer">
      <input type="checkbox" ${selected.includes(it.id)?'checked':''}
             onchange="toggleUserForm${kind}('${esc(it.id)}', this.checked)">
      <span style="color:var(--text-body);font-size:12px">${esc(it.name)}</span>
    </label>
  `).join('');

  return `
    <div class="modal-overlay" style="display:flex" onclick="if(event.target===this)closeUserForm()">
      <div class="modal" style="width:520px;max-width:calc(100vw - 32px);max-height:90vh;overflow-y:auto">
        <h3>${isNew ? 'New User' : 'Edit User — ' + esc(f.data.username)}</h3>
        ${isNew ? `
          <label>Username</label>
          <input type="text" id="uf-username" value="${esc(f.data.username)}" autofocus>
        ` : ''}
        <label style="margin-top:10px">Email</label>
        <input type="email" id="uf-email" value="${esc(f.data.email||'')}">
        <label style="margin-top:10px">Password${isNew ? '' : ' (leave blank to keep current)'}</label>
        <input type="password" id="uf-password" ${isNew?'required':''} value="">

        <label style="margin-top:14px">Roles</label>
        <div style="max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px 12px;background:var(--bg-input)">
          ${checkboxList(state.roles.map(r=>({id:r.id,name:r.name})), f.data.role_ids||[], 'Role')}
        </div>

        <label style="margin-top:14px">Groups</label>
        <div style="max-height:130px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:8px 12px;background:var(--bg-input)">
          ${state.groups.length ? checkboxList(state.groups.map(g=>({id:g.id,name:g.name})), f.data.group_ids||[], 'Group')
            : '<span style="color:var(--text-faded);font-size:11px">No groups yet</span>'}
        </div>

        <label style="margin-top:12px;display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="uf-enabled" ${f.data.enabled?'checked':''}>
          <span style="font-size:12px;color:var(--text-body)">User is enabled (can sign in)</span>
        </label>

        <div class="modal-actions" style="margin-top:18px">
          <button class="btn btn-secondary" onclick="closeUserForm()">Cancel</button>
          <button class="btn btn-primary" onclick="submitUserForm()">${isNew ? 'Create User' : 'Save'}</button>
        </div>
      </div>
    </div>
  `;
}

function toggleUserFormRole(id, checked) {
  const f = state.userForm; if (!f) return;
  f.data.role_ids = f.data.role_ids || [];
  if (checked) { if (!f.data.role_ids.includes(id)) f.data.role_ids.push(id); }
  else f.data.role_ids = f.data.role_ids.filter(x => x !== id);
}
function toggleUserFormGroup(id, checked) {
  const f = state.userForm; if (!f) return;
  f.data.group_ids = f.data.group_ids || [];
  if (checked) { if (!f.data.group_ids.includes(id)) f.data.group_ids.push(id); }
  else f.data.group_ids = f.data.group_ids.filter(x => x !== id);
}

async function submitUserForm() {
  const f = state.userForm; if (!f) return;
  const email = document.getElementById('uf-email').value.trim();
  const password = document.getElementById('uf-password').value;
  const enabled = document.getElementById('uf-enabled').checked;

  try {
    if (f.mode === 'new') {
      const username = document.getElementById('uf-username').value.trim();
      if (!username || !password) { toast('error', 'Username and password required'); return; }
      if (password.length < 8) { toast('error', 'Password must be at least 8 characters'); return; }
      const r = await fetch('/api/users/new', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, enabled, role_ids: f.data.role_ids||[], group_ids: f.data.group_ids||[] }),
      });
      const d = await r.json();
      if (!r.ok) { toast('error', d.error || 'Failed'); return; }
      toast('success', 'User created');
    } else {
      const body = {
        email, enabled,
        role_ids: f.data.role_ids || [], group_ids: f.data.group_ids || [],
      };
      if (password) body.password = password;
      const r = await fetch('/api/users/' + encodeURIComponent(f.data.id), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const d = await r.json();
      if (!r.ok) { toast('error', d.error || 'Failed'); return; }
      toast('success', 'User updated');
    }
    closeUserForm();
    await loadSettingsData();
  } catch (e) {
    toast('error', 'Failed: ' + e.message);
  }
}

async function deleteUser(id, name) {
  if (!confirm('Delete user "' + name + '"? This cannot be undone.')) return;
  try {
    const r = await fetch('/api/users/' + encodeURIComponent(id), { method: 'DELETE' });
    const d = await r.json();
    if (!r.ok) { toast('error', d.error || 'Failed'); return; }
    toast('success', 'User deleted');
    await loadSettingsData();
  } catch (e) { toast('error', e.message); }
}

function toggleGroupFormRole(id, checked) {

async function submitGroupForm() {
  const f = state.groupForm; if (!f) return;
  const name = document.getElementById('gf-name').value.trim();
  const description = document.getElementById('gf-desc').value.trim();
  if (!name) { toast('error', 'Name required'); return; }
  const body = { name, description, role_ids: f.data.role_ids || [] };
  try {
    const url = f.mode === 'new' ? '/api/groups/new' : '/api/groups/' + encodeURIComponent(f.data.id);

function copyDeploySnippet(btnId, text) {
  const flashCopied = () => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 1800);
  };

  // Prefer the modern Clipboard API (requires HTTPS or localhost).
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(flashCopied).catch(fallbackCopy);
    return;
  }
  fallbackCopy();

  function fallbackCopy() {
    // Legacy path — works on plain HTTP. Creates a hidden textarea, selects
    // its contents, runs execCommand('copy'), then removes it.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) flashCopied();
    else toast('error', 'Copy failed — select the text manually');
  }
}

// ── VM Detail view ─────────────────────────────────────────
function renderVMView() {
  const vm = state.vms.find(v => v.uuid === state.selectedVM);
  if (!vm) return emptyState('VM not found', 'This VM is no longer in the inventory.');

  switch (state.vmTab || 'summary') {
    case 'snapshots': return renderVMSnapshotsTab(vm);
    case 'monitor':   return renderVMMonitorTab(vm);
    case 'hardware':  return renderVMHardwareTab(vm);
    case 'networks':  return renderVMNetworksTab(vm);
    default:          return renderVMSummaryTab(vm);
  }
}

function vmDetailHeader(vm) {
  const running = vm.state === 'running';
  return `
    <div style="margin:-20px -20px 20px -20px">
      <div class="vm-actions-bar">
        <span class="vm-title">${esc(vm.name)}</span>
        <span class="vm-pill vm-state ${vm.state}">${vm.state}</span>
        <button class="btn btn-primary btn-sm" ${vm.state==='stopped'?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','START')">▶ Start</button>
        <button class="btn btn-warning btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','STOP')">■ Shutdown</button>
        <button class="btn btn-secondary btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','RESTART')">↺ Restart</button>
        <button class="btn btn-danger btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','FORCESTOP')">⚡ Force Off</button>
        <button class="btn btn-secondary btn-sm" ${running?'':'disabled'} onclick="openMigrateDialog('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}')" title="Live migrate to another host">↗ Migrate</button>
      </div>
    </div>
  `;
}

function renderVMMonitorTab(vm) {
  const cpuPct = Math.min(vm.cpu_usage || 0, 100);
  const cpuColor = cpuPct > 85 ? 'bar-danger' : cpuPct > 65 ? 'bar-warn' : 'bar-cpu';
  const memPct = vm.mem_total_mb > 0 ? Math.min(vm.mem_usage_mb / vm.mem_total_mb * 100, 100) : 0;
  const memColor = memPct > 85 ? 'bar-danger' : memPct > 65 ? 'bar-warn' : 'bar-mem';
  const hostDiskPct = vm.disk_total_gb > 0 ? Math.min(vm.disk_usage_gb / vm.disk_total_gb * 100, 100) : 0;

  const bigPanel = (title, value, sub, bar, color) => `
    <div class="detail-panel" style="padding:18px 22px">
      <div class="resource-label" style="font-size:13px;margin-bottom:6px">
        <span>${title}</span>
        <span style="font-size:22px;color:var(--text-strong);font-weight:300">${value}</span>
      </div>
      <div class="resource-bar" style="height:10px"><div class="resource-bar-fill ${color}" style="width:${bar}%"></div></div>
      <div style="font-size:11px;color:var(--text-faded);margin-top:6px">${sub}</div>
    </div>
  `;

  const fsPanels = (vm.guest_fs || []).map(fs => {
    const pct = fs.total_gb > 0 ? (fs.used_gb / fs.total_gb * 100) : 0;
    const color = pct > 85 ? 'bar-danger' : pct > 65 ? 'bar-warn' : 'bar-disk';
    return bigPanel(
      `Guest Filesystem · <span style="font-family:'SF Mono',monospace;font-size:12px">${esc(fs.mountpoint)}</span> (${esc(fs.fstype)})`,
      pct.toFixed(1) + '%',
      `${fs.used_gb.toFixed(1)} GB used of ${fs.total_gb.toFixed(1)} GB`,
      pct.toFixed(1),
      color
    );
  }).join('');

  const toolsNote = vm.guest_agent
    ? ''
    : `<div class="detail-panel" style="border-left:3px solid #ff9800;padding:12px 16px">
         <span style="color:#ffb74d">⚠ KVM Tools not installed — guest filesystem metrics unavailable.</span>
         <span style="color:var(--text-faded);font-size:11px;display:block;margin-top:4px">Install kvm-tools inside the VM to see per-mountpoint usage.</span>
       </div>`;

  return vmDetailHeader(vm) + `
    <div class="section-title">Real-time Resource Utilisation</div>
    ${bigPanel('CPU Usage', cpuPct.toFixed(1) + '%', `${vm.cpu_count} vCPU${vm.cpu_count===1?'':'s'}`, cpuPct, cpuColor)}
    ${bigPanel('Memory Usage', memPct.toFixed(1) + '%', `${fmt(vm.mem_usage_mb,'MB')} of ${fmt(vm.mem_total_mb,'MB')}`, memPct, memColor)}
    ${bigPanel('Host Disk (image storage)', hostDiskPct.toFixed(1) + '%', `${vm.disk_usage_gb.toFixed(1)} GB of ${vm.disk_total_gb.toFixed(1)} GB on <code style="font-size:11px">${esc(vm.disk_path || '—')}</code>`, hostDiskPct, hostDiskPct > 85 ? 'bar-danger' : hostDiskPct > 65 ? 'bar-warn' : 'bar-disk')}
    ${fsPanels}
    ${toolsNote}
    <div style="margin-top:14px;padding:10px 14px;background:var(--bg-input);border:1px solid #30363D;border-radius:4px;font-size:11px;color:var(--text-faded)">
      ℹ Values refresh every 15 seconds from the hypervisor agent. Historical charts are not retained.
    </div>
  `;
}

function renderVMNetworksTab(vm) {
  const nics = vm.networks || [];
  if (nics.length === 0) {
    return vmDetailHeader(vm) + emptyState('No network adapters', 'This VM has no network interfaces defined.');
  }

  const guestIPs = vm.guest_ips || [];

  const cards = nics.map((n, i) => {
    const rxMB = (n.rx_bytes / 1048576).toFixed(2);
    const txMB = (n.tx_bytes / 1048576).toFixed(2);
    return `
      <div class="detail-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div>
            <div style="font-size:14px;font-weight:600;color:var(--text-strong)">Network Adapter ${i+1}</div>
            <div style="font-size:11px;color:var(--text-faded);font-family:'SF Mono',monospace">${esc(n.interface || 'host-side tap')}</div>
          </div>
          <span class="vm-pill" style="background:#3D2510;color:#FF8A3C">BRIDGED</span>
        </div>
        <div class="vm-info-grid" style="grid-template-columns:140px 1fr">
          <span class="lbl">Bridge:</span>
          <span class="val">${esc(n.bridge || '—')}</span>
          <span class="lbl">MAC Address:</span>
          <span class="val" style="font-family:'SF Mono',monospace;font-size:11px">${esc(n.mac || '—')}</span>
          <span class="lbl">Host-side Tap:</span>
          <span class="val" style="font-family:'SF Mono',monospace;font-size:11px">${esc(n.interface || '—')}</span>
          <span class="lbl">RX Bytes:</span>
          <span class="val">${rxMB} MB</span>
          <span class="lbl">TX Bytes:</span>
          <span class="val">${txMB} MB</span>
        </div>
      </div>
    `;
  }).join('');

  const guestSection = vm.guest_agent && guestIPs.length
    ? `
      <div class="section-title" style="margin-top:18px">Guest IP Addresses (from KVM Tools)</div>
      <div class="detail-panel">
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${guestIPs.map(ip => `<span style="padding:5px 12px;border:1px solid #30363D;border-radius:3px;font-family:'SF Mono',monospace;font-size:12px;color:var(--text-body);background:var(--bg-input)">${esc(ip)}</span>`).join('')}
        </div>
      </div>
    `
    : `
      <div class="section-title" style="margin-top:18px">Guest IP Addresses</div>
      <div class="detail-panel" style="border-left:3px solid #ff9800">
        <span style="color:#ffb74d">⚠ KVM Tools not installed</span>
        <span style="color:var(--text-faded);font-size:11px;display:block;margin-top:4px">Guest-side IP addresses require KVM Tools or qemu-guest-agent inside the VM.</span>
      </div>
    `;

  return vmDetailHeader(vm) + `
    <div class="section-title">Virtual Network Adapters (${nics.length})</div>
    ${cards}
    ${guestSection}
  `;
}

      <button class="btn btn-warning btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','STOP')" title="Graceful shutdown">■ Shutdown</button>
      <button class="btn btn-secondary btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','RESTART')" title="Restart">↺ Restart</button>
      <button class="btn btn-danger btn-sm" ${running?'':'disabled'} onclick="sendCmd('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}','FORCESTOP')" title="Force power off">⚡ Force Off</button>
      <button class="btn btn-secondary btn-sm" onclick="openSnapshot('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}')" title="Create snapshot">📷 Snapshot</button>
    </div>
  `;

  // Left column: thumbnail + launch console
  const consoleDisabled = running && host && host.ip ? '' : 'disabled';
  const leftCol = `

      <div class="vm-thumbnail">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF8A3C" stroke-width="1.5">

  // Middle column: guest info card
  const toolsPill = hasTools
    ? `<span class="vm-tools-pill running">KVM Tools: ${esc(vm.guest_source || 'running')}</span>`

  const dim = (val, fallback) => val
    ? `<span class="val">${esc(val)}</span>`
    : `<span class="val dim">${fallback || '—'}</span>`;
  const dimList = (arr, fallback) => arr && arr.length
    ? `<span class="val">${arr.map(esc).join(', ')}</span>`
    : `<span class="val dim">${fallback || '—'}</span>`;

  const middleCol = `
    <div class="vm-info-card">
      ${toolsPill}
      <div class="vm-info-grid">
        <span class="lbl">Guest OS:</span>
        ${dim(vm.guest_os, 'KVM Tools required')}
        <span class="lbl">Hostname:</span>
        ${dim(vm.guest_hostname, 'KVM Tools required')}

        ${dimList(vm.guest_ips, 'KVM Tools required')}
        <span class="lbl">Host:</span>
        <span class="val">

function renderVMSnapshotsTab(vm) {
  const header = `
    <div style="margin:-20px -20px 20px -20px">
      <div class="vm-actions-bar">
        <span class="vm-title">${esc(vm.name)}</span>
        <span class="vm-pill vm-state ${vm.state}">${vm.state}</span>
        <button class="btn btn-secondary btn-sm" onclick="openSnapshot('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}')">📷 Create Snapshot</button>
      </div>
    </div>
  `;
  // Lazy-load: if selectedSnapshotVM mismatches, fetch.
  const sel = state.selectedSnapshotVM;
  if (!sel || sel.host_id !== vm.host_id || sel.name !== vm.name) {
    state.selectedSnapshotVM = { host_id: vm.host_id, name: vm.name };
    state.snapshotList = [];
    state.snapshotLoading = true;
    fetchSnapshots(vm.host_id, vm.name);
    return header + `<div class="empty-state"><p style="color:var(--text-faded)">Loading snapshots…</p></div>`;
  }
  if (state.snapshotLoading) {
    return header + `<div class="empty-state"><p style="color:var(--text-faded)">Loading snapshots…</p></div>`;
  }
  return header + renderSnapshotDetailTable(vm, state.snapshotList);
}

// renderSnapshotDetailTable is a header-less variant of renderSnapshotDetail for the VM view.
function renderSnapshotDetailTable(vm, snaps) {
  if (!snaps || snaps.length === 0) {
    return emptyState('No snapshots', 'Create a snapshot to see it listed here.');
  }
  const rows = snaps.map(s => `
    <tr>
      <td style="font-weight:500;color:var(--text-strong)">
        ${esc(s.name)}
        ${s.is_current ? '<span style="margin-left:8px;font-size:9px;padding:1px 6px;border-radius:10px;background:#3D2510;color:#FF8A3C;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Current</span>' : ''}
      </td>
      <td style="color:var(--text-muted);font-size:11px;font-family:'SF Mono',monospace">${esc(s.creation_time)}</td>
      <td><span class="vm-state ${s.state==='running'?'running':'stopped'}">${esc(s.state)}</span></td>
      <td style="color:var(--text-faded);font-size:11px">${s.parent ? esc(s.parent) : '—'}</td>
      <td>
        <div class="actions-row">
          <button class="btn btn-primary btn-sm" ${s.is_current ? 'disabled' : ''} onclick="revertSnapshot('${esc(vm.host_id)}','${esc(vm.name)}','${esc(s.name)}')">↶ Revert</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSnapshot('${esc(vm.host_id)}','${esc(vm.name)}','${esc(s.name)}')">🗑 Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Snapshot</th><th>Created</th><th>State</th><th>Parent</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function toggleVMSection(which) {
  if (which === 'hardware') state.vmHardwareOpen = !state.vmHardwareOpen;
  else if (which === 'related') state.vmRelatedOpen = !state.vmRelatedOpen;
  else if (which === 'networks') state.vmNetworksOpen = !state.vmNetworksOpen;
  render();
}

function startNotesEdit(initial) {
  state.notesDraft = initial || '';
  render();
  setTimeout(() => {
    const el = document.getElementById('notes-draft');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}
function cancelNotesEdit() {
  state.notesDraft = null;
  render();
}
async function saveNotes(uuid) {
  const notes = state.notesDraft || '';
  try {
    const r = await fetch(API + '/api/vms/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uuid, notes }),
    });
    if (!r.ok) throw new Error(r.statusText);
    toast('success', 'Notes saved');
    state.notesDraft = null;
    await refresh();
  } catch (e) {
    toast('error', `Failed to save notes: ${e.message}`);
  }
}

// ── VM Migration dialog ────────────────────────────────────
function openMigrateDialog(hostID, vmUUID, vmName) {
  const vm = state.vms.find(v => v.uuid === vmUUID);
  if (!vm) { toast('error', 'VM not found'); return; }

  const sourceHost = state.hosts.find(h => h.id === hostID);
  const otherHosts = state.hosts.filter(h => h.id !== hostID && h.status === 'online');
  if (!otherHosts.length) { toast('error', 'No other online hosts available for migration'); return; }

  window._migrateVM = { hostID, vmUUID, vmName, vm, sourceHost };
  window._migrateMode = 'offline'; // default to offline (faster)

  function liveChecks(targetID) {
    const target = state.hosts.find(h => h.id === targetID);
    if (!target) return [];
    return [
      { ok: target.status === 'online', label: 'Target host is online', detail: target.status },
      { ok: (target.mem_free_mb||0) >= (vm.mem_total_mb||0), label: 'Sufficient free memory', detail: fmt(target.mem_free_mb,'MB')+' free, VM needs '+fmt(vm.mem_total_mb,'MB') },
      { ok: (sourceHost?.cpu_model||'') === (target.cpu_model||'') || vm.cpu_mode !== 'host-passthrough', label: 'CPU compatibility', detail: (sourceHost?.cpu_model||'') === (target.cpu_model||'') ? 'Same CPU model' : 'host-passthrough requires matching CPUs' },
      { ok: !(vm.pci_devices && vm.pci_devices.length > 0), label: 'No PCI passthrough devices', detail: (vm.pci_devices||[]).length ? vm.pci_devices.length+' device(s) block live migration' : 'None' },
      { ok: vm.disk_type !== 'raw', label: 'Disk format supports migration', detail: (vm.disk_type||'qcow2') },
      { ok: !(vm.snapshot_count > 0), label: 'No snapshots', detail: (vm.snapshot_count||0) > 0 ? vm.snapshot_count+' snapshot(s) — delete first' : 'None' },
    ];
  }

  function offlineChecks(targetID) {
    const target = state.hosts.find(h => h.id === targetID);
    if (!target) return [];
    return [
      { ok: target.status === 'online', label: 'Target host is online', detail: target.status },
      { ok: (target.mem_free_mb||0) >= (vm.mem_total_mb||0), label: 'Sufficient free memory', detail: fmt(target.mem_free_mb,'MB')+' free, VM needs '+fmt(vm.mem_total_mb,'MB') },
      { ok: true, label: 'CPU compatibility', detail: 'Not required for offline migration (no live state transfer)' },
      { ok: true, label: 'PCI passthrough', detail: 'OK — VM will be shut down during migration' },
      { ok: true, label: 'Disk format', detail: 'qemu-img convert handles all formats including raw' },
      { ok: true, label: 'Snapshots', detail: (vm.snapshot_count||0) > 0 ? 'Backing chain will be flattened during conversion' : 'None' },
    ];
  }

  window._migrateChecks = { live: liveChecks, offline: offlineChecks };

  const defaultTarget = otherHosts[0].id;

  function renderModal() {
    const mode = window._migrateMode;
    const targetID = document.getElementById('migrate-target')?.value || defaultTarget;
    const checks = window._migrateChecks[mode](targetID);
    const allOk = checks.every(c => c.ok);

    const modeDesc = mode === 'offline'
      ? `<div style="font-size:11px;color:var(--text-faded);margin:8px 0;padding:10px 12px;background:var(--bg-input);border:1px solid #30363D;border-radius:4px;border-left:3px solid #E3571E;line-height:1.5;word-wrap:break-word">
          <strong style="color:var(--text-strong)">Offline migration:</strong> Shuts down the VM, compresses the disk with qemu-img convert (dramatically smaller transfer), copies to target, defines and starts the VM there. <strong style="color:#4caf50">Recommended for local storage.</strong>
        </div>`
      : `<div style="font-size:11px;color:var(--text-faded);margin:8px 0;padding:10px 12px;background:var(--bg-input);border:1px solid #30363D;border-radius:4px;border-left:3px solid #ff9800;line-height:1.5;word-wrap:break-word">
          <strong style="color:var(--text-strong)">Live migration:</strong> Copies the full disk image while the VM keeps running. <strong style="color:#ff9800">Very slow without shared storage</strong> — copies the entire virtual disk size, not just allocated blocks.
        </div>`;

    return `
      <div class="modal-overlay" id="migrate-modal" style="display:flex" onclick="if(event.target===this)closeMigrateModal()">
        <div class="modal" style="width:560px;max-width:calc(100vw - 40px);max-height:90vh;overflow-y:auto">
          <h3>Migrate — ${esc(vmName)}</h3>

          <div style="display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #30363D;padding-bottom:0">
            <div class="tab ${mode==='offline'?'active':''}" onclick="setMigrateMode('offline')" style="cursor:pointer;padding:6px 14px;font-size:12px;border-bottom:2px solid ${mode==='offline'?'#E3571E':'transparent'};color:${mode==='offline'?'#F0F6FC':'#8B949E'}">Offline (Recommended)</div>
            <div class="tab ${mode==='live'?'active':''}" onclick="setMigrateMode('live')" style="cursor:pointer;padding:6px 14px;font-size:12px;border-bottom:2px solid ${mode==='live'?'#ff9800':'transparent'};color:${mode==='live'?'#F0F6FC':'#8B949E'}">Live</div>
          </div>

          ${modeDesc}

          <label>Source Host</label>
          <div style="padding:4px 0;font-weight:600;color:var(--text-strong);font-size:13px">${esc(hostID)}</div>

          <select id="migrate-target" onchange="updateMigrateChecks()"
            ${otherHosts.map(h => `<option value="${esc(h.id)}" ${h.id===targetID?'selected':''}>${esc(h.id)} (${esc(h.ip)}) — ${fmt(h.mem_free_mb,'MB')} free</option>`).join('')}
          </select>

          ${mode==='live' ? `
          <div style="margin-top:12px;padding:10px 14px;background:var(--bg-input);border:1px solid #30363D;border-radius:4px;overflow:hidden">
            <div style="font-size:11px;font-weight:600;color:var(--text-strong);margin-bottom:8px">Storage Transfer</div>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-bottom:6px">

            <div style="font-size:11px;color:var(--text-faded);line-height:1.5;padding-left:24px">Copies the full virtual disk to the target during migration. Required when hypervisors do not share a common storage backend (NFS, GlusterFS, Ceph). Disable only if both hosts mount the same storage pool.</div>

          ${mode==='offline' && vm.disk_type === 'raw' ? `
          <div style="margin-top:12px;padding:10px 14px;background:var(--bg-input);border:1px solid #30363D;border-radius:4px;overflow:hidden">
            <div style="font-size:11px;font-weight:600;color:var(--text-strong);margin-bottom:8px">Disk Format After Migration</div>
            <div style="font-size:11px;color:var(--text-faded);margin-bottom:10px">This VM uses <strong style="color:#ff9800">raw</strong> disk images. The disk is always transferred as compressed qcow2 for speed. Choose the final format on the target:</div>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-bottom:8px">
              <input type="radio" name="migrate-disk-fmt" value="qcow2" checked style="accent-color:#E3571E;flex-shrink:0;margin-top:2px">
              <span style="font-size:12px;color:var(--text-body);min-width:0"><strong>Convert to qcow2</strong><br><span style="color:var(--text-faded);font-size:11px">Enables snapshots, thin provisioning, smaller footprint</span></span>
            </label>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">
              <input type="radio" name="migrate-disk-fmt" value="raw" style="accent-color:#E3571E;flex-shrink:0;margin-top:2px">
              <span style="font-size:12px;color:var(--text-body);min-width:0"><strong>Keep raw</strong><br><span style="color:var(--text-faded);font-size:11px">Converted back to raw on the target after transfer (slightly slower)</span></span>
            </label>
          </div>
          ` : ''}

          <div style="margin-top:12px">
            <label>Pre-flight Checks</label>
            <div id="migrate-checks" style="margin-top:6px">
              ${checks.map(c => `
                <div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px">
                  <span style="color:${c.ok?'#4caf50':'#f44336'};flex-shrink:0">${c.ok?'✓':'✗'}</span>
                  <div>
                    <div style="color:var(--text-strong)">${esc(c.label)}</div>
                    <div style="color:var(--text-faded);font-size:11px">${esc(c.detail)}</div>
                  </div>
                </div>
              `).join('')}

          </div>
          <div class="modal-actions" style="margin-top:14px">
            <button class="btn btn-secondary" onclick="closeMigrateModal()">Cancel</button>

        </div>
      </div>
