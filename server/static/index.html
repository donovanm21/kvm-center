// ── VM Migration dialog ────────────────────────────────────
function openMigrateDialog(hostID, vmUUID, vmName) {
  const vm = state.vms.find(v => v.uuid === vmUUID);
  if (!vm) { toast('error', 'VM not found'); return; }

  const sourceHost = state.hosts.find(h => h.id === hostID);
  const otherHosts = state.hosts.filter(h => h.id !== hostID && h.status === 'online');
  if (!otherHosts.length) { toast('error', 'No other online hosts available for migration'); return; }

  window._migrateVM = { hostID, vmUUID, vmName, vm, sourceHost };
  window._migrateMode = 'offline'; // default to offline (faster)

  function liveChecks(targetID) {
    const target = state.hosts.find(h => h.id === targetID);
    if (!target) return [];
    return [
      { ok: target.status === 'online', label: 'Target host is online', detail: target.status },
      { ok: (target.mem_free_mb||0) >= (vm.mem_total_mb||0), label: 'Sufficient free memory', detail: fmt(target.mem_free_mb,'MB')+' free, VM needs '+fmt(vm.mem_total_mb,'MB') },
      { ok: (sourceHost?.cpu_model||'') === (target.cpu_model||'') || vm.cpu_mode !== 'host-passthrough', label: 'CPU compatibility', detail: (sourceHost?.cpu_model||'') === (target.cpu_model||'') ? 'Same CPU model' : 'host-passthrough requires matching CPUs' },
      { ok: !(vm.pci_devices && vm.pci_devices.length > 0), label: 'No PCI passthrough devices', detail: (vm.pci_devices||[]).length ? vm.pci_devices.length+' device(s) block live migration' : 'None' },
      { ok: vm.disk_type !== 'raw', label: 'Disk format supports migration', detail: (vm.disk_type||'qcow2') },
      { ok: !(vm.snapshot_count > 0), label: 'No snapshots', detail: (vm.snapshot_count||0) > 0 ? vm.snapshot_count+' snapshot(s) — delete first' : 'None' },
    ];
  }

  function offlineChecks(targetID) {
    const target = state.hosts.find(h => h.id === targetID);
    if (!target) return [];
    return [
      { ok: target.status === 'online', label: 'Target host is online', detail: target.status },
      { ok: (target.mem_free_mb||0) >= (vm.mem_total_mb||0), label: 'Sufficient free memory', detail: fmt(target.mem_free_mb,'MB')+' free, VM needs '+fmt(vm.mem_total_mb,'MB') },
      { ok: true, label: 'CPU compatibility', detail: 'Not required for offline migration (no live state transfer)' },
      { ok: true, label: 'PCI passthrough', detail: 'OK — VM will be shut down during migration' },
      { ok: true, label: 'Disk format', detail: 'qemu-img convert handles all formats including raw' },
      { ok: true, label: 'Snapshots', detail: (vm.snapshot_count||0) > 0 ? 'Backing chain will be flattened during conversion' : 'None' },
    ];
  }

  window._migrateChecks = { live: liveChecks, offline: offlineChecks };

  const defaultTarget = otherHosts[0].id;

  function renderModal() {
    const mode = window._migrateMode;
    const targetID = document.getElementById('migrate-target')?.value || defaultTarget;
    const checks = window._migrateChecks[mode](targetID);
    const allOk = checks.every(c => c.ok);

    const modeDesc = mode === 'offline'
      ? `<div style="font-size:11px;color:#5a8ab0;margin:8px 0;padding:10px 12px;background:#091828;border:1px solid #1a3a5c;border-radius:4px;border-left:3px solid #0091da;line-height:1.5;word-wrap:break-word">
          <strong style="color:#e8f4ff">Offline migration:</strong> Shuts down the VM, compresses the disk with qemu-img convert (dramatically smaller transfer), copies to target, defines and starts the VM there. <strong style="color:#4caf50">Recommended for local storage.</strong>
        </div>`
      : `<div style="font-size:11px;color:#5a8ab0;margin:8px 0;padding:10px 12px;background:#091828;border:1px solid #1a3a5c;border-radius:4px;border-left:3px solid #ff9800;line-height:1.5;word-wrap:break-word">
          <strong style="color:#e8f4ff">Live migration:</strong> Copies the full disk image while the VM keeps running. <strong style="color:#ff9800">Very slow without shared storage</strong> — copies the entire virtual disk size, not just allocated blocks.
        </div>`;

    return `
      <div class="modal-overlay" id="migrate-modal" style="display:flex" onclick="if(event.target===this)closeMigrateModal()">
        <div class="modal" style="width:560px;max-width:calc(100vw - 40px);max-height:90vh;overflow-y:auto">
          <h3>Migrate — ${esc(vmName)}</h3>

          <div style="display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #1a3a5c;padding-bottom:0">
            <div class="tab ${mode==='offline'?'active':''}" onclick="setMigrateMode('offline')" style="cursor:pointer;padding:6px 14px;font-size:12px;border-bottom:2px solid ${mode==='offline'?'#0091da':'transparent'};color:${mode==='offline'?'#e8f4ff':'#7aa8cc'}">Offline (Recommended)</div>
            <div class="tab ${mode==='live'?'active':''}" onclick="setMigrateMode('live')" style="cursor:pointer;padding:6px 14px;font-size:12px;border-bottom:2px solid ${mode==='live'?'#ff9800':'transparent'};color:${mode==='live'?'#e8f4ff':'#7aa8cc'}">Live</div>
          </div>

          ${modeDesc}

          <label>Source Host</label>
          <div style="padding:4px 0;font-weight:600;color:#e8f4ff;font-size:13px">${esc(hostID)}</div>
          <label style="margin-top:10px">Target Host</label>
          <select id="migrate-target" onchange="updateMigrateChecks()" style="width:100%;background:#091828;border:1px solid #1a3a5c;color:#c5daf0;padding:8px;border-radius:4px;font-size:12px;font-family:inherit">
            ${otherHosts.map(h => `<option value="${esc(h.id)}" ${h.id===targetID?'selected':''}>${esc(h.id)} (${esc(h.ip)}) — ${fmt(h.mem_free_mb,'MB')} free</option>`).join('')}
          </select>

          ${mode==='live' ? `
          <label style="margin-top:10px;display:flex;align-items:flex-start;gap:8px;cursor:pointer">
            <input type="checkbox" id="migrate-copy-storage" checked style="accent-color:#0091da;flex-shrink:0;margin-top:2px">
            <span style="font-size:12px;color:#c5daf0;min-width:0">Copy storage (required without shared NFS)</span>
          </label>` : ''}

          ${mode==='offline' && vm.disk_type === 'raw' ? `
          <div style="margin-top:12px;padding:10px 14px;background:#091828;border:1px solid #1a3a5c;border-radius:4px;overflow:hidden">
            <div style="font-size:11px;font-weight:600;color:#e8f4ff;margin-bottom:8px">Disk Format After Migration</div>
            <div style="font-size:11px;color:#5a8ab0;margin-bottom:10px">This VM uses <strong style="color:#ff9800">raw</strong> disk images. The disk is always transferred as compressed qcow2 for speed. Choose the final format on the target:</div>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-bottom:8px">
              <input type="radio" name="migrate-disk-fmt" value="qcow2" checked style="accent-color:#0091da;flex-shrink:0;margin-top:2px">
              <span style="font-size:12px;color:#c5daf0;min-width:0"><strong>Convert to qcow2</strong><br><span style="color:#5a8ab0;font-size:11px">Enables snapshots, thin provisioning, smaller footprint</span></span>
            </label>
            <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">
              <input type="radio" name="migrate-disk-fmt" value="raw" style="accent-color:#0091da;flex-shrink:0;margin-top:2px">
              <span style="font-size:12px;color:#c5daf0;min-width:0"><strong>Keep raw</strong><br><span style="color:#5a8ab0;font-size:11px">Converted back to raw on the target after transfer (slightly slower)</span></span>
            </label>
          </div>
          ` : ''}

          <div style="margin-top:12px">
            <label>Pre-flight Checks</label>
            <div id="migrate-checks" style="margin-top:6px">
              ${checks.map(c => `
                <div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px">
                  <span style="color:${c.ok?'#4caf50':'#f44336'};flex-shrink:0">${c.ok?'✓':'✗'}</span>
                  <div>
                    <div style="color:#e8f4ff">${esc(c.label)}</div>
                    <div style="color:#5a8ab0;font-size:11px">${esc(c.detail)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="modal-actions" style="margin-top:14px">
            <button class="btn btn-secondary" onclick="closeMigrateModal()">Cancel</button>
            <button class="btn btn-primary" id="migrate-btn" ${allOk?'':'disabled'} onclick="executeMigrate('${esc(hostID)}','${esc(vmUUID)}','${esc(vmName)}')">${mode==='offline' ? 'Shut Down & Migrate' : 'Live Migrate'}</button>
          </div>
        </div>
      </div>
    `;
  }

  window._renderMigrateModal = renderModal;

  const existing = document.getElementById('migrate-modal');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', renderModal());
}

function setMigrateMode(mode) {
  window._migrateMode = mode;
  const existing = document.getElementById('migrate-modal');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', window._renderMigrateModal());
}

function updateMigrateChecks() {
  const mode = window._migrateMode || 'offline';
  const targetID = document.getElementById('migrate-target').value;
  const checks = window._migrateChecks[mode](targetID);
  const container = document.getElementById('migrate-checks');
  container.innerHTML = checks.map(c => `
    <div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:12px">
      <span style="color:${c.ok?'#4caf50':'#f44336'};flex-shrink:0">${c.ok?'✓':'✗'}</span>
      <div>
        <div style="color:#e8f4ff">${esc(c.label)}</div>
        <div style="color:#5a8ab0;font-size:11px">${esc(c.detail)}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('migrate-btn').disabled = !checks.every(c => c.ok);
}

function closeMigrateModal() {
  const el = document.getElementById('migrate-modal');
  if (el) el.remove();
}

function migrationID() {
  return 'mig-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
}

async function recordMigration(rec) {
  try {
    await fetch(API + '/api/migrations/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rec),
    });
  } catch (e) { /* best-effort */ }
}

async function executeMigrate(hostID, vmUUID, vmName) {
  const mode = window._migrateMode || 'offline';
  const targetID = document.getElementById('migrate-target').value;
  const target = state.hosts.find(h => h.id === targetID);
  if (!target) return;
  closeMigrateModal();

  const id = migrationID();
  const rec = {
    id, vm_name: vmName, source_host: hostID, dest_host: targetID,
    mode, status: 'running', started_at: Math.floor(Date.now()/1000), progress: 0, phase: 'starting',
  };
  await recordMigration(rec);

  if (mode === 'offline') {
    try {
      const r = await fetch(API + '/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host_id: hostID, vm_uuid: vmUUID, vm_name: vmName, action: 'OFFLINE_MIGRATE', params: {
        destination: target.ip,
        keep_raw: document.querySelector('input[name="migrate-disk-fmt"][value="raw"]')?.checked ? 'true' : 'false',
      } }),
      });
      const data = await r.json();
      if (data.success) {
        showMigrateProgress(hostID, vmName, targetID, id);
      } else {
        rec.status = 'failed'; rec.error = data.message || data.error;
        rec.completed_at = Math.floor(Date.now()/1000);
        await recordMigration(rec);
        toast('error', `Migration failed: ${rec.error}`);
      }
    } catch (e) {
      rec.status = 'failed'; rec.error = e.message;
      rec.completed_at = Math.floor(Date.now()/1000);
      await recordMigration(rec);
      toast('error', `Migration failed: ${e.message}`);
    }
  } else {
    const copyStorage = document.getElementById('migrate-copy-storage')?.checked;
    toast('info', `Live migrating ${vmName} to ${targetID}…`);
    try {
      const params = { destination: target.ip };
      if (copyStorage) params.copy_storage = 'true';
      const r = await fetch(API + '/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host_id: hostID, vm_uuid: vmUUID, vm_name: vmName, action: 'MIGRATE', params }),
      });
      const data = await r.json();
      const now = Math.floor(Date.now()/1000);
      if (data.success || r.ok) {
        rec.status = 'complete'; rec.progress = 100; rec.completed_at = now;
        rec.elapsed_sec = now - rec.started_at; rec.detail = 'Live migration completed';
        toast('success', `Live migration completed`);
        setTimeout(refresh, 3000);
      } else {
        rec.status = 'failed'; rec.error = data.message || data.error; rec.completed_at = now;
        toast('error', `Migration failed: ${rec.error}`);
      }
      await recordMigration(rec);
    } catch (e) {
      rec.status = 'failed'; rec.error = e.message;
      rec.completed_at = Math.floor(Date.now()/1000);
      await recordMigration(rec);
      toast('error', `Migration failed: ${e.message}`);
    }
  }
}

function showMigrateProgress(hostID, vmName, targetID, migRecordID) {
  let pollId = null;
  const phaseLabels = {
    starting: 'Initialising', shutdown: 'Shutting down', convert: 'Compressing disk',
    transfer: 'Transferring', define: 'Defining on target', start: 'Starting on target',
    complete: 'Complete', failed: 'Failed'
  };
  const phaseColors = { complete: '#4caf50', failed: '#f44336' };

  function renderProgress(s) {
    const pct = s.progress || 0;
    const label = phaseLabels[s.phase] || s.phase;
    const barColor = phaseColors[s.phase] || '#0091da';
    const elapsed = s.elapsed_s ? `${Math.floor(s.elapsed_s/60)}m ${s.elapsed_s%60}s` : '—';
    const isDone = s.phase === 'complete' || s.phase === 'failed';

    return `
      <div class="modal-overlay" id="migrate-progress-modal" style="display:flex">
        <div class="modal" style="width:480px">
          <h3>Migrating ${esc(vmName)}</h3>
          <div style="font-size:11px;color:#5a8ab0;margin-bottom:12px">${esc(hostID)} → ${esc(targetID)}</div>

          <div style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:13px;color:#e8f4ff;font-weight:600">${label}</span>
              <span style="font-size:13px;color:#e8f4ff;font-weight:300">${pct}%</span>
            </div>
            <div class="resource-bar" style="height:10px">
              <div style="height:100%;border-radius:3px;background:${barColor};width:${pct}%;transition:width 0.5s"></div>
            </div>
          </div>

          <div style="font-size:12px;color:#c5daf0;margin-bottom:6px">${esc(s.detail || '')}</div>
          <div style="font-size:11px;color:#5a8ab0">Elapsed: ${elapsed}</div>

          ${s.error ? `<div style="margin-top:10px;padding:8px 12px;background:#2a0f0f;border:1px solid #f44336;border-radius:4px;color:#e57373;font-size:12px">${esc(s.error)}</div>` : ''}

          ${isDone ? `
            <div class="modal-actions" style="margin-top:16px">
              <button class="btn btn-primary" onclick="closeMigrateProgress()">Close</button>
            </div>
          ` : `
            <div style="margin-top:12px;font-size:10px;color:#3d6a8a;text-align:center">Polling every 3 seconds…</div>
          `}
        </div>
      </div>
    `;
  }

  async function poll() {
    try {
      const r = await fetch(`${API}/api/migrate-status?host=${encodeURIComponent(hostID)}`);
      const s = await r.json();
      const el = document.getElementById('migrate-progress-modal');
      if (el) el.outerHTML = renderProgress(s);
      else document.body.insertAdjacentHTML('beforeend', renderProgress(s));

      if (s.phase === 'complete') {
        clearInterval(pollId);
        toast('success', `Migration of ${vmName} to ${targetID} completed in ${Math.floor(s.elapsed_s/60)}m ${s.elapsed_s%60}s`);
        recordMigration({ id: migRecordID, vm_name: vmName, source_host: hostID, dest_host: targetID, mode: 'offline', status: 'complete', progress: 100, started_at: s.started_at, completed_at: Math.floor(Date.now()/1000), elapsed_sec: s.elapsed_s, detail: s.detail });
        setTimeout(refresh, 3000);
      } else if (s.phase === 'failed') {
        clearInterval(pollId);
        toast('error', `Migration failed: ${s.error || 'unknown error'}`);
        recordMigration({ id: migRecordID, vm_name: vmName, source_host: hostID, dest_host: targetID, mode: 'offline', status: 'failed', progress: s.progress, started_at: s.started_at, completed_at: Math.floor(Date.now()/1000), elapsed_sec: s.elapsed_s, error: s.error, detail: s.detail });
        setTimeout(refresh, 2000);
      }
    } catch (e) {
      // network blip — keep polling
    }
  }

  // Initial render + start polling
  document.body.insertAdjacentHTML('beforeend', renderProgress({
    phase: 'starting', progress: 0, detail: 'Waiting for agent…', elapsed_s: 0
  }));
  poll();
  pollId = setInterval(poll, 3000);
}

function closeMigrateProgress() {
  const el = document.getElementById('migrate-progress-modal');
  if (el) el.remove();
}

// ── Snapshots view ─────────────────────────────────────────
function renderSnapshotsView(q) {
  const vmsWithSnaps = state.vms.filter(v => (v.snapshot_count || 0) > 0);
  const filtered = q
    ? vmsWithSnaps.filter(v => v.name.toLowerCase().includes(q) || v.host_id.toLowerCase().includes(q))
    : vmsWithSnaps;

  const sel = state.selectedSnapshotVM;
  const selectedVM = sel ? state.vms.find(v => v.host_id === sel.host_id && v.name === sel.name) : null;

  const leftPanel = `
    <div class="detail-panel" style="padding:0;margin:0;min-width:280px;max-width:320px;flex-shrink:0">
      <div style="padding:12px 14px;border-bottom:1px solid #1a3a5c;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:#3d6a8a">
        VMs with Snapshots (${vmsWithSnaps.length})
      </div>
      ${filtered.length === 0
        ? '<div style="padding:16px;color:#3d6a8a;font-size:12px">No VMs with snapshots.</div>'
        : filtered.map(v => `
            <div class="host-tree-item ${sel && sel.host_id===v.host_id && sel.name===v.name ? 'active' : ''}"
                 style="padding:10px 14px;border-left:3px solid transparent"
                 onclick="selectSnapshotVM('${esc(v.host_id)}','${esc(v.name)}')">
              <div style="flex:1;min-width:0">
                <div style="color:#e8f4ff;font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.name)}</div>
                <div style="color:#5a8ab0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.host_id)}</div>
              </div>
              <span class="nav-badge">${v.snapshot_count}</span>
            </div>
          `).join('')}
    </div>
  `;

  let rightPanel;
  if (!sel) {
    rightPanel = emptyState('Select a VM', 'Pick a VM from the list to view and manage its snapshots.');
  } else if (!selectedVM) {
    rightPanel = emptyState('VM not found', 'The selected VM is no longer in the inventory.');
  } else if (state.snapshotLoading) {
    rightPanel = `<div class="empty-state"><p style="color:#5a8ab0">Loading snapshots…</p></div>`;
  } else {
    rightPanel = renderSnapshotDetail(selectedVM, state.snapshotList);
  }

  return `
    <div style="display:flex;gap:16px;align-items:flex-start">
      ${leftPanel}
      <div style="flex:1;min-width:0">${rightPanel}</div>
    </div>
  `;
}

function renderSnapshotDetail(vm, snaps) {
  const header = `
    <div class="detail-panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:16px;font-weight:600;color:#e8f4ff">${esc(vm.name)}</div>
          <div style="font-size:11px;color:#5a8ab0;margin-top:2px">${esc(vm.host_id)} · <span class="vm-state ${vm.state}">${vm.state}</span></div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="openSnapshot('${esc(vm.host_id)}','${esc(vm.uuid)}','${esc(vm.name)}')">📷 Create Snapshot</button>
          <button class="btn btn-secondary btn-sm" onclick="refreshSnapshots()">↺ Refresh</button>
        </div>
      </div>
    </div>
  `;

  if (!snaps || snaps.length === 0) {
    return header + emptyState('No snapshots', 'Create a snapshot to see it listed here.');
  }

  const rows = snaps.map(s => `
    <tr>
      <td style="font-weight:500;color:#e8f4ff">
        ${esc(s.name)}
        ${s.is_current ? '<span style="margin-left:8px;font-size:9px;padding:1px 6px;border-radius:10px;background:#0d3a5c;color:#4db8ff;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Current</span>' : ''}
      </td>
      <td style="color:#7aa8cc;font-size:11px;font-family:'SF Mono',monospace">${esc(s.creation_time)}</td>
      <td><span class="vm-state ${s.state==='running'?'running':'stopped'}">${esc(s.state)}</span></td>
      <td style="color:#5a8ab0;font-size:11px">${s.parent ? esc(s.parent) : '—'}</td>
      <td>
        <div class="actions-row">
          <button class="btn btn-primary btn-sm" ${s.is_current ? 'disabled title="Already current"' : ''} onclick="revertSnapshot('${esc(vm.host_id)}','${esc(vm.name)}','${esc(s.name)}')">↶ Revert</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSnapshot('${esc(vm.host_id)}','${esc(vm.name)}','${esc(s.name)}')">🗑 Delete</button>
        </div>
      </td>
    </tr>
  `).join('');

  return header + `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Snapshot</th>
            <th>Created</th>
            <th>State</th>
            <th>Parent</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function selectSnapshotVM(hostID, vmName) {
  state.selectedSnapshotVM = { host_id: hostID, name: vmName };
  state.snapshotList = [];
  state.snapshotLoading = true;
  render();
  await fetchSnapshots(hostID, vmName);
}

async function refreshSnapshots() {
  const sel = state.selectedSnapshotVM;
  if (!sel) return;
  state.snapshotLoading = true;
  render();
  await fetchSnapshots(sel.host_id, sel.name);
}

async function fetchSnapshots(hostID, vmName) {
  try {
    const r = await fetch(`${API}/api/vms/snapshots?host=${encodeURIComponent(hostID)}&vm=${encodeURIComponent(vmName)}`);
    if (!r.ok) throw new Error(r.statusText);
    const data = await r.json();
    state.snapshotList = data.snapshots || [];
  } catch (e) {
    toast('error', `Failed to load snapshots: ${e.message}`);
    state.snapshotList = [];
  } finally {
    state.snapshotLoading = false;
    render();
  }
}

async function revertSnapshot(hostID, vmName, snapName) {
  if (!confirm(`Revert ${vmName} to snapshot "${snapName}"?\n\nThis will discard the VM's current state.`)) return;
  toast('info', `Reverting ${vmName} to ${snapName}…`);
  try {
    const r = await fetch(API + '/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host_id: hostID, vm_name: vmName, action: 'REVERT_SNAPSHOT', params: { name: snapName } }),
    });
    const data = await r.json();
    if (data.success || r.ok) {
      toast('success', `Reverted to "${snapName}"`);
      setTimeout(refreshSnapshots, 1500);
      setTimeout(refresh, 2500);
    } else {
      toast('error', `Revert failed: ${data.message || data.error}`);
    }
  } catch (e) {
    toast('error', `Revert failed: ${e.message}`);
  }
}

async function deleteSnapshot(hostID, vmName, snapName) {
  if (!confirm(`Delete snapshot "${snapName}" from ${vmName}?\n\nThis cannot be undone.`)) return;
  toast('info', `Deleting snapshot "${snapName}"…`);
  try {
    const r = await fetch(API + '/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host_id: hostID, vm_name: vmName, action: 'DELETE_SNAPSHOT', params: { name: snapName } }),
    });
    const data = await r.json();
    if (data.success || r.ok) {
      toast('success', `Snapshot "${snapName}" deleted`);
      setTimeout(refreshSnapshots, 500);
      setTimeout(refresh, 2000);
    } else {
      toast('error', `Delete failed: ${data.message || data.error}`);
    }
  } catch (e) {
    toast('error', `Delete failed: ${e.message}`);
  }
}

// ── Commands ───────────────────────────────────────────────
async function sendCmd(hostID, vmUUID, vmName, action) {
  toast(`info`, `Sending ${action} to ${vmName}…`);
  try {
    const r = await fetch(API + '/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host_id: hostID, vm_uuid: vmUUID, vm_name: vmName, action }),
    });
    const data = await r.json();
    if (data.success || r.ok) {
      toast('success', `${action} sent to ${vmName}: ${data.message || 'OK'}`);
      setTimeout(refresh, 2000);
    } else {
      toast('error', `${action} failed: ${data.message || data.error}`);
    }
  } catch (e) {
    toast('error', `Command failed: ${e.message}`);
  }
}

function openSnapshot(hostID, vmUUID, vmName) {
  state.snapshotTarget = { hostID, vmUUID, vmName };
  const d = new Date();
  document.getElementById('snapshot-name').value =
    `snap-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  document.getElementById('snapshot-modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('snapshot-modal').style.display = 'none';
  state.snapshotTarget = null;
}

async function confirmSnapshot() {
  const name = document.getElementById('snapshot-name').value.trim();
  if (!name) { toast('error','Snapshot name required'); return; }
  const t = state.snapshotTarget;
  closeModal();
  toast('info', `Creating snapshot "${name}" for ${t.vmName}…`);
  try {
    const r = await fetch(API + '/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ host_id: t.hostID, vm_uuid: t.vmUUID, vm_name: t.vmName, action: 'SNAPSHOT', params: { name } }),
    });
    const data = await r.json();
    if (data.success || r.ok) {
      toast('success', `Snapshot "${name}" created`);
    } else {
      toast('error', `Snapshot failed: ${data.message || data.error}`);
    }
  } catch (e) {
    toast('error', `Snapshot failed: ${e.message}`);
  }
}

// ── Helpers ────────────────────────────────────────────────
function emptyState(title, msg) {
  return `<div class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
    </svg>
    <p style="color:#5a8ab0;font-size:15px;margin-bottom:4px">${title}</p>
    <p style="color:#3d6a8a;font-size:12px">${msg}</p>
  </div>`;
}

function toast(type, msg) {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(mb, unit) {
  if (!mb) return '—';
  if (mb >= 1024) return (mb/1024).toFixed(1) + ' GB';
  return mb + ' MB';
}

function relTime(iso) {
  if (!iso) return '—';
  const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (diff < 60)  return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  return `${Math.floor(diff/3600)}h ago`;
}

function pad(n) { return String(n).padStart(2,'0'); }
</script>
